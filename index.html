<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sensor Trilogy Global Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0b1a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #appContainer { width: 100%; max-width: 400px; height: 100vh; max-height: 750px; background: #121224; border: 3px solid #1f1f3d; border-radius: 20px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 25px; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .active { display: flex; }
        h1 { font-size: 26px; color: #00ffcc; margin-bottom: 15px; }
        p { font-size: 15px; color: #b3b3cc; margin-bottom: 30px; padding: 0 10px; line-height: 1.6; }
        button { padding: 16px 25px; font-size: 16px; font-weight: bold; background: linear-gradient(45deg, #ff0055, #ff00aa); color: #fff; border: none; border-radius: 30px; cursor: pointer; width: 90%; margin: 12px 0; }
        .sensor-indicator { width: 90px; height: 90px; border-radius: 50%; border: 5px solid #00ffcc; display: flex; justify-content: center; align-items: center; font-size: 32px; margin-top: 25px; background: #1a1a36; }
    </style>
</head>
<body>
<div id="appContainer">
    <div id="menuScreen" class="screen active">
        <h1>SENSOR TRILOGY</h1>
        <p>Play 3 unique games powered completely by your device's physical sensors. No downloads required!</p>
        <button onclick="startSetup(1)">1. Blow & Fly: Tiny Bird 🕊️</button>
        <button onclick="startSetup(2)">2. Pocket Quake: Box Sorter 📦</button>
        <button onclick="startSetup(3)">3. The Cursed Book 📖</button>
    </div>
    <div id="permissionScreen" class="screen">
        <h1>Enable Sensors</h1>
        <p>This game needs access to your Microphone (for blowing) and Motion Sensors (for shaking).</p>
        <button onclick="requestPermissions()">Grant Access & Play</button>
    </div>
    <div id="gameScreen" class="screen">
        <h1 id="gameTitle">Game Loaded</h1>
        <p id="gameInstructions">Interact with your device now.</p>
        <div id="visualFeedback" class="sensor-indicator">0</div>
        <button onclick="backToMenu()" style="background: #25254d; margin-top: 50px; font-size: 14px; width: 60%;">← Back to Menu</button>
    </div>
</div>
<script>
    let activeGame = 0;
    let audioContext, analyser, microphone, javascriptNode;
    let lastX, lastY, lastZ;
    let moveCounter = 0;

    function startSetup(gameNumber) { activeGame = gameNumber; changeScreen('permissionScreen'); }
    function changeScreen(screenId) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(screenId).classList.add('active'); }

    async function requestPermissions() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            setupAudio(stream);
        } catch (err) { console.log("Microphone denied."); }

        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
            try {
                const permissionState = await DeviceMotionEvent.requestPermission();
                if (permissionState === 'granted') { window.addEventListener('devicemotion', handleMotion, true); }
            } catch (err) { console.log("Motion denied."); }
        } else {
            window.addEventListener('devicemotion', handleMotion, true);
        }
        launchGame();
    }

    function setupAudio(stream) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);
        analyser.smoothingTimeConstant = 0.8;
        analyser.fftSize = 1024;
        microphone.connect(analyser); analyser.connect(javascriptNode); javascriptNode.connect(audioContext.destination);

        javascriptNode.onaudioprocess = function() {
            const array = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(array);
            let values = 0;
            for (let i = 0; i < array.length; i++) { values += array[i]; }
            let average = values / array.length;
            if (activeGame === 1 || activeGame === 3) {
                if(Math.round(average) > 35) {
                    document.getElementById('visualFeedback').innerText = "💨";
                    if(activeGame === 1) { document.getElementById('gameInstructions').innerText = "Awesome! The bird is flying UP!"; }
                    else if(activeGame === 3) { document.getElementById('gameInstructions').innerText = "Blow detected! Next page unlocked!"; }
                } else {
                    if(activeGame === 1) { document.getElementById('visualFeedback').innerText = "⬇️"; }
                }
            }
        }
    }

    function handleMotion(event) {
        if (activeGame !== 2 && activeGame !== 3) return;
        let acc = event.accelerationIncludingGravity;
        if (!acc.x) return;
        if (lastX === undefined) { lastX = acc.x; lastY = acc.y; lastZ = acc.z; return; }

        let deltaX = Math.abs(lastX - acc.x);
        let deltaY = Math.abs(lastY - acc.y);

        if (deltaX > 11 && deltaY > 11) {
            moveCounter++;
            document.getElementById('visualFeedback').innerText = "🫨";
            if(activeGame === 2) { document.getElementById('gameInstructions').innerText = "Boxes sorted! Quake Power: " + moveCounter; }
            else if(activeGame === 3) { document.getElementById('gameInstructions').innerText = "Book shaken! Ghost banished!"; }
        }
        lastX = acc.x; lastY = acc.y; lastZ = acc.z;
    }

    function launchGame() {
        changeScreen('gameScreen');
        moveCounter = 0;
        if (activeGame === 1) {
            document.getElementById('gameTitle').innerText = "Blow & Fly";
            document.getElementById('gameInstructions').innerText = "Blow into your mic to keep the bird in the air.";
            document.getElementById('visualFeedback').innerText = "🕊️";
        } else if (activeGame === 2) {
            document.getElementById('gameTitle').innerText = "Pocket Quake";
            document.getElementById('gameInstructions').innerText = "Shake your device vigorously to sort boxes.";
            document.getElementById('visualFeedback').innerText = "📦";
        } else if (activeGame === 3) {
            document.getElementById('gameTitle').innerText = "The Cursed Book";
            document.getElementById('gameInstructions').innerText = "SHAKE to banish spirits, then BLOW to turn pages.";
            document.getElementById('visualFeedback').innerText = "📖";
        }
    }

    function backToMenu() { activeGame = 0; changeScreen('menuScreen'); }
</script>
</body>
</html>
